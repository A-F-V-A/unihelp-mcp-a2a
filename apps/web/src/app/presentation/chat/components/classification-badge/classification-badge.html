<span
  class="clasificacion"
  [class]="'clasificacion clasificacion--' + tipo()"
  [attr.title]="descripcion() + ' Confianza: ' + confianza()"
  [attr.data-tipo]="tipo()"
>
  <svg class="clasificacion__icono" viewBox="0 0 24 24" aria-hidden="true">
    @switch (tipo()) {
      @case ('informativa') {
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5M12 8h.01" />
      }
      @case ('diagnostico') {
        <circle cx="11" cy="11" r="6" />
        <path d="m20 20-4.5-4.5" />
      }
      @case ('compuesta') {
        <path d="m12 3 9 5-9 5-9-5 9-5Z" />
        <path d="m3 13 9 5 9-5" />
      }
      @case ('fuera-de-alcance') {
        <circle cx="12" cy="12" r="9" />
        <path d="m5.7 5.7 12.6 12.6" />
      }
    }
  </svg>
  <span class="visualmente-oculto">Clasificación de la solicitud:</span>
  <span class="clasificacion__etiqueta">{{ etiqueta() }}</span>
  <span class="clasificacion__confianza">{{ confianza() }}</span>
</span>
