<section class="fuera-alcance" role="note" aria-labelledby="fuera-alcance-titulo">
  <div class="fuera-alcance__encabezado">
    <svg class="fuera-alcance__icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
      <path d="M12 9v4M12 17h.01" />
    </svg>
    <h4 id="fuera-alcance-titulo" class="fuera-alcance__titulo">
      Esta solicitud está fuera del alcance de UniHelp
    </h4>
  </div>

  <p class="fuera-alcance__motivo">{{ motivo() }}</p>

  <div class="fuera-alcance__canal">
    <p class="sobretitulo">Acude a</p>
    <p class="fuera-alcance__nombre">{{ canal().nombre }}</p>
    <p class="fuera-alcance__contacto">
      <span class="tenue">{{ tipoCanal() }}:&nbsp;</span>
      @if (enlace(); as href) {
        <a [href]="href">{{ canal().contacto }}</a>
      } @else {
        <strong>{{ canal().contacto }}</strong>
      }
    </p>
    @if (canal().horario; as horario) {
      <p class="fuera-alcance__contacto tenue">{{ horario }}</p>
    }
  </div>
</section>
