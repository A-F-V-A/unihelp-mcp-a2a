# ===========================================================================
# UniHelp - orquestacion local de las cuatro arquitecturas
# ===========================================================================
#
# Cada arquitectura vive en un "profile" de Compose, de modo que se levanta UNA
# sola a la vez y se evalua aislada:
#
#   docker compose --profile b0 up --build   -> b0-directo + web
#   docker compose --profile b1 up --build   -> mcp-server + b1-mcp-agente + web
#   docker compose --profile b2 up --build   -> b2-multiagente-local + web
#   docker compose --profile b3 up --build   -> mcp-server + los tres servicios B3 + web
#
# Tambien se puede fijar la arquitectura con UNA variable, sin pasar --profile:
#
#   COMPOSE_PROFILES=b2 docker compose up --build
#
# Sea cual sea el profile, el backend de entrada queda SIEMPRE publicado en el
# puerto 3000 del host. Por eso el frontend es uno solo y su BACKEND_URL no
# cambia entre arquitecturas.
# ===========================================================================

name: unihelp

# ---------------------------------------------------------------------------
# Ajustes comunes a las siete apps NestJS
# ---------------------------------------------------------------------------
x-backend-comun: &backend-comun
  restart: unless-stopped
  networks:
    - unihelp
  environment: &entorno-comun
    NODE_ENV: production
    UNIHELP_VERSION: ${UNIHELP_VERSION:-0.1.0}
    # El navegador llama al backend desde otro origen (el frontend).
    CORS_ORIGEN: ${CORS_ORIGEN:-*}
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  # =========================================================================
  # B0 - agente unico con integracion directa a la API
  # =========================================================================
  b0-directo:
    <<: *backend-comun
    profiles: ['b0']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.b0-directo
    image: unihelp/b0-directo:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-b0-directo
    ports:
      # Puerto de entrada comun a las cuatro arquitecturas.
      - '${PUERTO_BACKEND:-3000}:3000'

  # =========================================================================
  # B1 - agente unico que consume las capacidades via servidor MCP
  # =========================================================================
  b1-mcp-agente:
    <<: *backend-comun
    profiles: ['b1']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.b1-mcp-agente
    image: unihelp/b1-mcp-agente:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-b1-mcp-agente
    environment:
      <<: *entorno-comun
      # Reservado para cuando se implemente el cliente MCP real.
      MCP_SERVER_URL: http://mcp-server:3010
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - '${PUERTO_BACKEND:-3000}:3001'

  # =========================================================================
  # B2 - varios agentes especializados en el mismo proceso (sin red entre ellos)
  # =========================================================================
  b2-multiagente-local:
    <<: *backend-comun
    profiles: ['b2']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.b2-multiagente-local
    image: unihelp/b2-multiagente-local:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-b2-multiagente-local
    ports:
      - '${PUERTO_BACKEND:-3000}:3002'

  # =========================================================================
  # B3 - agentes especializados como servicios independientes sobre A2A
  # =========================================================================
  b3-a2a-orquestador:
    <<: *backend-comun
    profiles: ['b3']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.b3-a2a-orquestador
    image: unihelp/b3-a2a-orquestador:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-b3-a2a-orquestador
    environment:
      <<: *entorno-comun
      # Reservado para cuando se implemente el transporte A2A real.
      A2A_CONOCIMIENTO_URL: http://b3-a2a-conocimiento:3004
      A2A_DIAGNOSTICO_URL: http://b3-a2a-diagnostico:3005
      MCP_SERVER_URL: http://mcp-server:3010
    depends_on:
      b3-a2a-conocimiento:
        condition: service_healthy
      b3-a2a-diagnostico:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    ports:
      - '${PUERTO_BACKEND:-3000}:3003'

  b3-a2a-conocimiento:
    <<: *backend-comun
    profiles: ['b3']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.b3-a2a-conocimiento
    image: unihelp/b3-a2a-conocimiento:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-b3-a2a-conocimiento
    environment:
      <<: *entorno-comun
      MCP_SERVER_URL: http://mcp-server:3010
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      # Expuesto para poder inspeccionar el especialista por separado.
      - '${PUERTO_B3_CONOCIMIENTO:-3004}:3004'

  b3-a2a-diagnostico:
    <<: *backend-comun
    profiles: ['b3']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.b3-a2a-diagnostico
    image: unihelp/b3-a2a-diagnostico:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-b3-a2a-diagnostico
    environment:
      <<: *entorno-comun
      MCP_SERVER_URL: http://mcp-server:3010
    depends_on:
      mcp-server:
        condition: service_healthy
    ports:
      - '${PUERTO_B3_DIAGNOSTICO:-3005}:3005'

  # =========================================================================
  # Servidor MCP compartido: participa en los profiles que lo consumen (b1, b3)
  # =========================================================================
  mcp-server:
    <<: *backend-comun
    profiles: ['b1', 'b3']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mcp-server
    image: unihelp/mcp-server:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-mcp-server
    ports:
      - '${PUERTO_MCP:-3010}:3010'

  # =========================================================================
  # Frontend unico: participa en los cuatro profiles
  # =========================================================================
  # No lleva `depends_on` a proposito: el backend de entrada cambia segun el
  # profile, y la UI ya reporta el error y ofrece reintentar si aun no responde.
  web:
    restart: unless-stopped
    networks:
      - unihelp
    profiles: ['b0', 'b1', 'b2', 'b3']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: unihelp/web:${UNIHELP_VERSION:-0.1.0}
    container_name: unihelp-web
    environment:
      # La lee el NAVEGADOR, por eso apunta al host y no a un nombre de
      # servicio de Docker. Nunca esta compilada dentro del bundle.
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
    ports:
      - '${PUERTO_WEB:-4200}:8080'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  unihelp:
    driver: bridge
