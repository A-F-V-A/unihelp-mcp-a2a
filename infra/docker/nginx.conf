# UniHelp - servido de la SPA Angular.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La configuracion de entorno se reescribe en cada arranque, asi que nunca
    # debe quedar cacheada: es lo que determina a que arquitectura apunta la UI.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Los artefactos con hash en el nombre si se pueden cachear agresivamente.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida la resuelve el router de Angular.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
